<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f766e"/>
      <stop offset="100%" style="stop-color:#67e8f9"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="100%" style="stop-color:#99f6e4"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)"/>

  <!-- C shape centered, open on right -->
  <path d="M 295,82 L 125,82 Q 88,82 83,124 L 83,270 Q 83,308 125,308 L 295,308"
    fill="none"
    stroke="url(#tealGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"/>

  <!-- Bars centered between C left wall and circle right -->
  <rect x="148" y="182" width="28" height="84" rx="5" fill="url(#tealGrad)" opacity="0.65"/>
  <rect x="188" y="150" width="28" height="116" rx="5" fill="url(#tealGrad)" opacity="0.82"/>
  <rect x="228" y="118" width="28" height="148" rx="5" fill="url(#tealGrad)"/>

  <!-- Arrow curve -->
  <path d="M 155 192 Q 202 148 272 108"
    fill="none" stroke="url(#arrowGrad)" stroke-width="5" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polygon points="272,108 253,118 258,134" fill="#99f6e4"/>

  <!-- CRECER text above divider line -->
  <text x="200" y="293"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-weight="800"
    font-size="28"
    letter-spacing="6"
    fill="#f8fafc">CRECER</text>

  <!-- Bottom of C at y=308 = divider line -->

  <!-- WEB Y MARKETING below divider -->
  <text x="200" y="334"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-weight="400"
    font-size="11"
    letter-spacing="5"
    fill="#67e8f9">WEB Y MARKETING</text>

</svg>
